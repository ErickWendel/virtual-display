name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check app/main.js
      - run: node --check app/preload.js
      - run: node --check app/platform/linux.js
      - run: node --check app/platform/hyprland.js
      - run: node --check app/renderer/renderer.js
