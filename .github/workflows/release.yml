name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify release version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools rpm

      - name: Build Linux packages
        run: npm run dist:linux

      - name: Verify artifacts and generate checksums
        run: |
          set -euo pipefail
          artifacts=(
            dist/virtual-display-*.AppImage
            dist/virtual-display-*.deb
            dist/virtual-display-*.rpm
            dist/virtual-display-*.pacman
            dist/virtual-display-*.tar.gz
          )
          for artifact in "${artifacts[@]}"; do
            test -s "$artifact"
          done
          (
            cd dist
            sha256sum \
              virtual-display-*.AppImage \
              virtual-display-*.deb \
              virtual-display-*.rpm \
              virtual-display-*.pacman \
              virtual-display-*.tar.gz \
              > SHA256SUMS
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/virtual-display-*.AppImage \
            dist/virtual-display-*.deb \
            dist/virtual-display-*.rpm \
            dist/virtual-display-*.pacman \
            dist/virtual-display-*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Virtual Display ${GITHUB_REF_NAME}"
